services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # internal only (not published) — reachable by api as mongo:27017

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # internal only — reachable by api as redis:6379

  minio:
    # MinIO Inc. stopped publishing images (Oct 2025); alpine/minio is a maintained drop-in fork
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    user: "0:0"   # own the fresh named volume (/data) so MinIO can write
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # public: presigned uploads + HLS playback hit this
      - "9001:9001"   # MinIO console (optional; close later)

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
      - redis
      - minio
    # no published port — nginx fronts it on the docker network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mongo-data:
  minio-data:
