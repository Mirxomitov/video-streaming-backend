services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # internal only (not published) — reachable by api as mongo:27017

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # internal only — reachable by api as redis:6379

  minio:
    # MinIO Inc. stopped publishing images (Oct 2025); alpine/minio is a maintained drop-in fork
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    user: "0:0"   # own the fresh named volume (/data) so MinIO can write
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    # No published ports: MinIO is reachable only on the Docker network
    # (api + nginx use minio:9000). Public access goes through nginx at
    # https://cdn.medic24.tj — uploads + HLS playback — so 9000/9001 stay closed.

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
      - redis
      - minio
    # no published port — nginx fronts it on the docker network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro          # TLS certs issued by certbot
      - certbot-www:/var/www/certbot              # ACME HTTP-01 challenge webroot
    # Reload every 12h so a renewed cert is picked up without a manual restart.
    command: /bin/sh -c "while :; do sleep 12h; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      - api

  # Issues + auto-renews the Let's Encrypt cert. Initial issuance is run manually:
  #   docker compose -f docker-compose.prod.yaml run --rm certbot certonly \
  #     --webroot -w /var/www/certbot -d stream.medic24.tj --email <you> --agree-tos --no-eff-email
  # After that this long-running container renews every 12h and nginx picks it up.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"

volumes:
  mongo-data:
  minio-data:
  certbot-conf:
  certbot-www:
