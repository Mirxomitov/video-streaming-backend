# ---- HTTP :80 — ACME challenge for all hosts, redirect everything else to HTTPS ----
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt issuance/renewal for stream.medic24.tj AND cdn.medic24.tj land here
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 — API (stream.medic24.tj) ----
server {
    listen 443 ssl;
    http2 on;
    server_name stream.medic24.tj;

    ssl_certificate     /etc/letsencrypt/live/stream.medic24.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.medic24.tj/privkey.pem;

    client_max_body_size 0;

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ---- HTTPS :443 — media / S3 (cdn.medic24.tj) -> MinIO ----
# Path is passed through unchanged (no rewrite) so presigned SigV4 signatures,
# which cover the request path and Host, validate against what MinIO receives.
server {
    listen 443 ssl;
    http2 on;
    server_name cdn.medic24.tj;

    ssl_certificate     /etc/letsencrypt/live/stream.medic24.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.medic24.tj/privkey.pem;

    # uploads can be large
    client_max_body_size 0;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
    }
}
